name: E2E Tests (Post-Deploy)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  deployment_status:
  workflow_dispatch:

jobs:
  # ── Gating: deterministic unit tests (no browser, no auth) ──
  # These are the real regression gate. E2E below is advisory because most
  # specs hit Clerk-protected routes and CI has no production Clerk instance
  # yet — until then an unauthenticated run lands on the sign-in page.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        run: npm run test:unit

  e2e:
    needs: unit
    if: >
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    # 15 min: the public-only run below is ~3-4 min of test time; the rest is
    # fixed cost (npm ci + Lightpanda install + the up-to-5-min "Wait for Vercel
    # deployment" loop). Generous enough that the upload steps are always
    # reached — the old 25-min job was being killed mid-run by a gated-route
    # retry storm before it could upload its report.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Lightpanda
        run: |
          set +e
          curl -sSfL https://get.lightpanda.io | bash
          if ! which lightpanda > /dev/null 2>&1; then
            echo "Official installer failed, downloading from GitHub releases..."
            sudo curl -sL -o /usr/local/bin/lightpanda \
              "https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux"
            sudo chmod +x /usr/local/bin/lightpanda
          fi
          set -e
          which lightpanda || { echo "::error::Lightpanda installation failed"; exit 1; }

      - name: Create screenshots dir
        run: mkdir -p e2e/screenshots

      - name: Wait for Vercel deployment
        if: github.event_name == 'push'
        run: |
          echo "Waiting for deployment to be ready..."
          HEADER=""
          if [ -n "$VERCEL_BYPASS" ]; then
            HEADER="-H x-vercel-protection-bypass: $VERCEL_BYPASS"
          fi
          for i in $(seq 1 30); do
            if [ -n "$VERCEL_BYPASS" ]; then
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_BYPASS" "$BASE_URL")
            else
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL")
            fi
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "✓ Deployment reachable (status=$STATUS)"
              exit 0
            fi
            echo "Attempt $i: status=$STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Deployment not reachable after 5 minutes"
          exit 1
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://f1-pulse-dealmaker-labs-projects.vercel.app' }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_F1_PULSE }}

      # E2E_PUBLIC_ONLY=1 (set on the two desktop/mobile steps below) narrows the
      # desktop/mobile projects to the no-Clerk public-signal specs and forces
      # retries:0 — see playwright.config.ts. Remove the flag (or set 0) once a
      # production Clerk session exists to run the full gated suite on every push.
      #
      # ── Mint Clerk session (storageState saved to playwright/.clerk/user.json) ──
      # Marked continue-on-error: when Clerk secrets are missing/expired, smoke
      # and post-deploy tests should still run on the live deployment. This step
      # does NOT set E2E_PUBLIC_ONLY, so the authenticated project keeps its full
      # spec set + retries once a real session is available.
      - name: Authenticate with Clerk
        continue-on-error: true
        run: npx playwright test --project=setup
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://f1-pulse-dealmaker-labs-projects.vercel.app' }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_F1_PULSE }}
          CDP_ENDPOINT: http://127.0.0.1:9222
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

      # Depends on the auth setup above — if that fails, this fails too. Soft-gated
      # for the same reason.
      - name: Run authenticated tests (Clerk-protected pages)
        continue-on-error: true
        run: npx playwright test --project=authenticated
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://f1-pulse-dealmaker-labs-projects.vercel.app' }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_F1_PULSE }}
          CDP_ENDPOINT: http://127.0.0.1:9222

      # Desktop + mobile projects, PUBLIC specs only (E2E_PUBLIC_ONLY=1) — the
      # no-Clerk specs that produce correct signal: public routes, /api/* contract
      # checks, theme, and gated-route redirect smoke. retries:0 in this mode, so
      # no gated redirect can cascade into a timeout. The gated feature specs are
      # deferred to the `authenticated` project above until a Clerk prod session
      # exists; flip E2E_PUBLIC_ONLY off there to run the full suite on push.
      # Advisory (continue-on-error) for now — the deterministic `unit` job is the
      # real gate; the report/screenshot artifacts still surface any failures.
      - name: Run desktop E2E (public specs)
        run: npx playwright test --project=desktop
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://f1-pulse-dealmaker-labs-projects.vercel.app' }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_F1_PULSE }}
          CDP_ENDPOINT: http://127.0.0.1:9222
          E2E_PUBLIC_ONLY: "1"
        continue-on-error: true

      - name: Run mobile E2E (public specs)
        run: npx playwright test --project=mobile
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://f1-pulse-dealmaker-labs-projects.vercel.app' }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS_F1_PULSE }}
          CDP_ENDPOINT: http://127.0.0.1:9222
          E2E_PUBLIC_ONLY: "1"
        continue-on-error: true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          retention-days: 7

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
